name: voices

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: List Cloud TTS voices
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          pip install -q google-auth requests
          python - <<'PY'
          import base64, json, os, requests
          from google.oauth2 import service_account
          import google.auth.transport.requests as gr

          raw = os.environ.get("GCP_SA_KEY", "")
          try:
              info = json.loads(raw)
          except Exception:
              info = json.loads(base64.b64decode(raw).decode("utf-8"))
          cr = service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/cloud-platform"])
          cr.refresh(gr.Request())
          hdr = {"Authorization": "Bearer " + cr.token}

          for lc in ["kk-KZ", "tr-TR", "uz-UZ", "ky-KG", "az-AZ", "ru-RU"]:
              r = requests.get("https://texttospeech.googleapis.com/v1/voices",
                               params={"languageCode": lc}, headers=hdr, timeout=60)
              try:
                  j = r.json()
              except Exception:
                  print("VOICES", lc, r.status_code, "no json")
                  continue
              vs = j.get("voices", [])
              print("VOICES", lc, r.status_code, "count", len(vs))
              for v in vs:
                  print("   ", v.get("name"), v.get("ssmlGender"))
              if not vs:
                  print("    err:", str(j)[:200])
          PY
