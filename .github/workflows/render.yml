name: render

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Задание в формате JSON (carousel или reel)"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages публикует сайт целиком, поэтому задания выполняются по очереди.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q pillow requests
          mkdir -p fonts
          curl -fsSL -o fonts/Montserrat.ttf "https://github.com/google/fonts/raw/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" || true
          curl -fsSL -o fonts/Playfair.ttf "https://github.com/google/fonts/raw/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" || true

      - name: Render
        env:
          JOB: ${{ inputs.job }}
          OUT_DIR: site
          SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
        run: python render.py --render

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send links to n8n
        env:
          JOB: ${{ inputs.job }}
          OUT_DIR: site
          PAGE_URL: ${{ steps.deploy.outputs.page_url }}
        run: python render.py --callback

      - name: Report failure to n8n
        if: failure()
        env:
          JOB: ${{ inputs.job }}
          FAIL_REASON: "render workflow failed, see GitHub Actions log"
        run: python render.py --fail
